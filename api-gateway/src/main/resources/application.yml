spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: Auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: edificio-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/edificio/**
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5500
              - http://localhost:5500
              - http://192.168.1.106:5500
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: 8080

gateway:
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt-secret: miClaveSecretaParaJWT1234567890123456789012345678901234567890
    public-paths:
      - /actuator/health
      - /api/v1/auth/login
      - /api/v1/auth/registro