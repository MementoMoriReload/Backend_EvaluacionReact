spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: edificio-route
          uri: ${EDIFICIO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/edificio/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
              - http://127.0.0.1:5500
              - http://localhost:5500
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: 8080

gateway:
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt-secret: ${JWT_SECRET:miClaveSecretaParaJWT1234567890123456789012345678901234567890}
    public-paths:
      - /actuator/health
      - /api/v1/auth/login
      - /api/v1/auth/registro