spring.application.name=gateway
server.port=8080

spring.cloud.gateway.routes[0].id=Auth-service-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=edificio-route
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/edificio/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://192.168.1.106:5500
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

gateway.security.enabled=${SECURITY_ENABLED:true}
gateway.security.jwt-secret=miClaveSecretaParaJWT1234567890123456789012345678901234567890
gateway.security.public-paths=/actuator/health,/api/v1/auth/login,/api/v1/auth/registro