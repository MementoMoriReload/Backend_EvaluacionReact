spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/Acceso_db?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081
  error:
    include-message: always

springdoc:
  api-docs:
    enabled: TRUE
  swagger-ui:
    enabled: TRUE
    path: /doc/swagger-ui.html

jwt:
  secret: miClaveSecretaParaJWT1234567890123456789012345678901234567890
  expiration: 86400000

